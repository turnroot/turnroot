name: Sync TODOs with Issues

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  sync-todos:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install PyGithub requests

      - name: Sync TODOs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          # We use github.ref_name to ensure the link points to the correct branch
          BRANCH_NAME: ${{ github.ref_name }} 
        run: |
          python - <<'EOF'
          import os
          import re
          import hashlib
          from github import Github, Auth
          from pathlib import Path

          auth = Auth.Token(os.environ['GITHUB_TOKEN'])
          g = Github(auth=auth)
          repo = g.get_repo(os.environ['GITHUB_REPOSITORY'])
          branch = os.environ['BRANCH_NAME']
          repo_url = f"https://github.com/{os.environ['GITHUB_REPOSITORY']}"

          def get_domain_tag(filepath):
              parts = Path(filepath).parts
              try:
                  idx = parts.index('TurnrootFramework')
                  if len(parts) > idx + 1:
                      return parts[idx + 1].lower()
              except (ValueError, IndexError):
                  pass
              return None

          def get_todo_hash(todo_text, domain):
              seed = f"{domain}:{todo_text.strip().lower()}"
              return hashlib.md5(seed.encode()).hexdigest()[:10]

          def extract_todos():
              todos = {}
              for path in Path('.').rglob('*.cs'):
                  if any(x in str(path) for x in ['bin/', 'obj/', '.git/']): continue
                  
                  try:
                      content = path.read_text(encoding='utf-8')
                      domain = get_domain_tag(path)
                      for i, line in enumerate(content.splitlines(), 1):
                          match = re.search(r'//\s*TODO:?\s*(.+)', line, re.IGNORECASE)
                          if match:
                              text = match.group(1).strip()
                              h = get_todo_hash(text, domain or "general")
                              
                              base_h = h
                              counter = 1
                              while h in todos:
                                  h = f"{base_h}_{counter}"
                                  counter += 1
                                  
                              todos[h] = {
                                  'file': str(path),
                                  'line': i,
                                  'text': text,
                                  'hash': h,
                                  'domain': domain
                              }
                  except Exception as e:
                      print(f"Skipping {path}: {e}")
              return todos

          def get_all_managed_issues():
              issues_map = {}
              query = f"repo:{os.environ['GITHUB_REPOSITORY']} is:issue is:open [Hash:"
              managed_issues = g.search_issues(query)
              
              for issue in managed_issues:
                  match = re.search(r'\[Hash:\s*`?([a-z0-9_]+)`?\]', issue.body)
                  if match:
                      h = match.group(1)
                      issues_map.setdefault(h, []).append(issue)
              return issues_map

          # --- Execution ---
          current_todos = extract_todos()
          existing_issues_groups = get_all_managed_issues()

          # 1. Cleanup
          for h, issues in existing_issues_groups.items():
              issues.sort(key=lambda x: x.created_at, reverse=True)
              keep_issue = issues[0]
              
              for extra in issues[1:]:
                  extra.create_comment(f"Closing as duplicate of #{keep_issue.number}")
                  extra.edit(state='closed')

              if h not in current_todos:
                  keep_issue.create_comment("TODO no longer found in code. Closing.")
                  keep_issue.edit(state='closed')
                  print(f"Resolved: #{keep_issue.number}")

          # 2. Create or Update
          for h, todo in current_todos.items():
              # Construct the clickable GitHub URL
              file_link = f"{repo_url}/blob/{branch}/{todo['file']}#L{todo['line']}"
              
              title = f"TODO: {todo['text'][:60]}"
              body = (f"**Description:** {todo['text']}\n\n"
                      f"**Location:** [{todo['file']} (Line {todo['line']})]({file_link})\n\n"
                      f"---\n[Hash: `{h}`]")
              
              found_group = existing_issues_groups.get(h)
              if found_group:
                  issue = found_group[0]
                  if issue.body != body:
                      issue.edit(title=title, body=body)
                      print(f"Updated #{issue.number}")
              else:
                  labels = ['todo', 'automated']
                  if todo['domain']:
                      labels.append(todo['domain'])
                  
                  new_issue = repo.create_issue(title=title, body=body, labels=labels)
                  print(f"Created #{new_issue.number} for {h}")

          EOF
