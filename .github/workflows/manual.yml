name: Sync TODOs with Issues

on:
  push:
    branches:
      - main
      - master
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  sync-todos:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read
      pull-requests: read
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install PyGithub requests

      - name: Sync TODOs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python - <<'EOF'
          import os
          import re
          import subprocess
          import hashlib
          from github import Github, Auth
          from pathlib import Path
          
          # Use the modern Auth method to avoid DeprecationWarning
          auth = Auth.Token(os.environ['GITHUB_TOKEN'])
          g = Github(auth=auth)
          repo = g.get_repo(os.environ['GITHUB_REPOSITORY'])
          
          def get_todo_hash(filepath, todo_text):
              unique_str = f"{filepath}:{todo_text}"
              return hashlib.md5(unique_str.encode()).hexdigest()[:8]
          
          def get_domain_tag(filepath):
              parts = Path(filepath).parts
              try:
                  idx = parts.index('TurnrootFramework')
                  if len(parts) > idx + 1:
                      return parts[idx + 1].lower()
              except (ValueError, IndexError):
                  pass
              return None
          
          def extract_todos(ref='HEAD'):
              todos = {}
              try:
                  result = subprocess.run(
                      ['git', 'ls-tree', '-r', '--name-only', ref],
                      capture_output=True, text=True, check=True
                  )
                  files = [f for f in result.stdout.split('\n') if f.endswith('.cs')]
              except:
                  files = [str(p) for p in Path('.').rglob('*.cs')]
              
              for filepath in files:
                  try:
                      result = subprocess.run(
                          ['git', 'show', f'{ref}:{filepath}'],
                          capture_output=True, text=True, check=False
                      )
                      if result.returncode != 0: continue
                      
                      lines = result.stdout.split('\n')
                      for line_num, line in enumerate(lines, 1):
                          match = re.search(r'//\s*TODO:?\s*(.+)', line, re.IGNORECASE)
                          if match:
                              todo_text = match.group(1).strip()
                              todo_hash = get_todo_hash(filepath, todo_text)
                              todos[todo_hash] = {
                                  'file': filepath,
                                  'line': line_num,
                                  'text': todo_text,
                                  'hash': todo_hash,
                                  'domain': get_domain_tag(filepath)
                              }
                  except Exception as e:
                      print(f"Error processing {filepath}: {e}")
              return todos
          
          def get_existing_todo_issues():
              issues_map = {}
              # Fetching open issues with the specific label
              for issue in repo.get_issues(state='open', labels=['todo', 'automated']):
                  match = re.search(r'\[([a-f0-9]{8})\]', issue.title)
                  if match:
                      h = match.group(1)
                      issues_map.setdefault(h, []).append(issue)
              return issues_map
          
          def cleanup_duplicates(issues_map):
              cleaned_map = {}
              for h, issues in issues_map.items():
                  issues.sort(key=lambda x: x.number)
                  keep = issues[0]
                  for duplicate in issues[1:]:
                      try:
                          duplicate.create_comment(f"Closing as duplicate of #{keep.number}")
                          duplicate.edit(state='closed')
                      except Exception as e:
                          print(f"Failed to close duplicate #{duplicate.number}: {e}")
                  cleaned_map[h] = keep
              return cleaned_map
          
          def create_or_update_issue(todo, existing_issue=None):
              title = f"TODO [{todo['hash']}]: {todo['text'][:60]}"
              body = f"**TODO found in code:**\n\n**File:** `{todo['file']}`\n**Line:** {todo['line']}\n**Description:** {todo['text']}\n\n---\n*Hash: `{todo['hash']}`*"
              
              if existing_issue:
                  # Only update if there is a content change
                  if existing_issue.body != body or existing_issue.title != title:
                      try:
                          existing_issue.edit(title=title, body=body)
                          print(f"Updated issue #{existing_issue.number}")
                      except Exception as e:
                          print(f"Failed to update issue #{existing_issue.number}: {e}")
              else:
                  labels = ['todo', 'automated']
                  if todo['domain']:
                      labels.append(todo['domain'])
                  try:
                      issue = repo.create_issue(title=title, body=body, labels=labels)
                      print(f"Created issue #{issue.number} for hash {todo['hash']}")
                  except Exception as e:
                      print(f"Failed to create issue for {todo['hash']}: {e}")
          
          # --- Execution ---
          current_todos = extract_todos('HEAD')
          raw_issues = get_existing_todo_issues()
          existing_issues = cleanup_duplicates(raw_issues)
          
          # 3. CLOSE issues missing from current code
          for h, issue in existing_issues.items():
              if h not in current_todos:
                  try:
                      issue.create_comment("TODO no longer found in code. Closing.")
                      # Explicitly only update state to avoid validation errors
                      issue.edit(state='closed')
                      print(f"Closed issue #{issue.number} (Resolved)")
                  except Exception as e:
                      print(f"Error closing issue #{issue.number}: {e}")
          
          # 4. CREATE or UPDATE
          for h, todo in current_todos.items():
              create_or_update_issue(todo, existing_issues.get(h))
          EOF
