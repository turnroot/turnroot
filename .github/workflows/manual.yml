name: Sync TODOs with Issues

on:
  push:
    branches:
      - main
      - master
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  sync-todos:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read
      pull-requests: read
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Get full history for comparison

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install PyGithub requests

      - name: Sync TODOs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.event.pull_request.base.sha }}
          HEAD_REF: ${{ github.sha }}
        run: |
          python - <<'EOF'
          import os
          import re
          import subprocess
          from github import Github
          from pathlib import Path
          import hashlib
          
          g = Github(os.environ['GITHUB_TOKEN'])
          repo = g.get_repo(os.environ['GITHUB_REPOSITORY'])
          
          def get_todo_hash(filepath, todo_text, occurrence):
              """
              Creates a hash based on file and content. 
              'occurrence' handles multiple identical TODOs in one file.
              """
              unique_str = f"{filepath}:{todo_text}:{occurrence}"
              return hashlib.md5(unique_str.encode()).hexdigest()[:8]
          
          def get_domain_tag(filepath):
              parts = Path(filepath).parts
              try:
                  idx = parts.index('TurnrootFramework')
                  if len(parts) > idx + 1:
                      return parts[idx + 1].lower()
              except (ValueError, IndexError):
                  pass
              return None
          
          def extract_todos(ref='HEAD'):
              todos = {}
              try:
                  result = subprocess.run(
                      ['git', 'ls-tree', '-r', '--name-only', ref],
                      capture_output=True, text=True, check=True
                  )
                  files = [f for f in result.stdout.split('\n') if f.endswith('.cs')]
              except:
                  files = [str(p) for p in Path('.').rglob('*.cs')]
              
              for filepath in files:
                  try:
                      result = subprocess.run(
                          ['git', 'show', f'{ref}:{filepath}'],
                          capture_output=True, text=True, check=False
                      )
                      if result.returncode != 0: continue
                      
                      lines = result.stdout.split('\n')
                      content_counts = {} # Tracks identical TODOs in the same file
                      
                      for line_num, line in enumerate(lines, 1):
                          match = re.search(r'//\s*TODO:?\s*(.+)', line, re.IGNORECASE)
                          if match:
                              todo_text = match.group(1).strip()
                              
                              # Track occurrence to keep hash unique but stable
                              content_counts[todo_text] = content_counts.get(todo_text, 0) + 1
                              todo_hash = get_todo_hash(filepath, todo_text, content_counts[todo_text])
                              
                              todos[todo_hash] = {
                                  'file': filepath,
                                  'line': line_num,
                                  'text': todo_text,
                                  'hash': todo_hash,
                                  'domain': get_domain_tag(filepath)
                              }
                  except Exception as e:
                      print(f"Error processing {filepath}: {e}")
              return todos
          
          def get_existing_todo_issues():
              """Returns a dict where key is hash and value is a LIST of issue objects."""
              issues_map = {}
              for issue in repo.get_issues(state='open', labels=['todo', 'automated']):
                  match = re.search(r'\[([a-f0-9]{8})\]', issue.title)
                  if match:
                      h = match.group(1)
                      if h not in issues_map:
                          issues_map[h] = []
                      issues_map[h].append(issue)
              return issues_map
          
          def cleanup_duplicates(issues_map):
              """Closes duplicate issues for the same hash, keeping only the lowest ID."""
              cleaned_map = {}
              for h, issues in issues_map.items():
                  if len(issues) > 1:
                      # Sort by issue number ascending
                      issues.sort(key=lambda x: x.number)
                      keep = issues[0]
                      to_close = issues[1:]
                      print(f"Found {len(issues)} issues for hash {h}. Keeping #{keep.number}.")
                      for duplicate in to_close:
                          duplicate.create_comment("Closing as duplicate of #" + str(keep.number))
                          duplicate.edit(state='closed')
                          print(f"Closed duplicate issue #{duplicate.number}")
                      cleaned_map[h] = keep
                  else:
                      cleaned_map[h] = issues[0]
              return cleaned_map
          
          def create_or_update_issue(todo, existing_issue=None):
              title = f"TODO [{todo['hash']}]: {todo['text'][:60]}"
              body = f"**TODO found in code:**\n\n**File:** `{todo['file']}`\n**Line:** {todo['line']}\n**Description:** {todo['text']}\n\n---\n*Hash: `{todo['hash']}`*"
              
              if existing_issue:
                  # Update existing issue if line number or file moved
                  if existing_issue.body != body or existing_issue.title != title:
                      existing_issue.edit(title=title, body=body)
                      print(f"Updated issue #{existing_issue.number} for hash {todo['hash']}")
              else:
                  labels = ['todo', 'automated']
                  if todo['domain']:
                      labels.append(todo['domain'])
                  issue = repo.create_issue(title=title, body=body, labels=labels)
                  print(f"Created issue #{issue.number} for hash {todo['hash']}")
          
          # --- Main Logic ---
          current_todos = extract_todos('HEAD')
          raw_issues = get_existing_todo_issues()
          
          # 1. Deduplicate existing open issues
          existing_issues = cleanup_duplicates(raw_issues)
          
          # 2. Close TODOs that no longer exist in code (PR only)
          event_name = os.environ.get('EVENT_NAME')
          if event_name == 'pull_request':
              base_ref = os.environ.get('BASE_REF')
              if base_ref:
                  base_todos = extract_todos(base_ref)
                  removed_hashes = set(base_todos.keys()) - set(current_todos.keys())
                  for h in removed_hashes:
                      if h in existing_issues:
                          issue = existing_issues[h]
                          issue.create_comment("TODO removed from code. Closing issue.")
                          issue.edit(state='closed')
                          print(f"Closed issue #{issue.number} (TODO removed)")
          
          # 3. Create new or Update existing
          for h, todo in current_todos.items():
              create_or_update_issue(todo, existing_issues.get(h))
          EOF
