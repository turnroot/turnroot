name: Sync TODOs with Issues

on:
  push:
    branches:
      - main
      - master
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  sync-todos:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read
      pull-requests: read
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Get full history for comparison

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install PyGithub requests

      - name: Sync TODOs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.event.pull_request.base.sha }}
          HEAD_REF: ${{ github.sha }}
        run: |
          python - <<'EOF'
          import os
          import re
          import subprocess
          from github import Github
          from pathlib import Path
          import hashlib

          g = Github(os.environ['GITHUB_TOKEN'])
          repo = g.get_repo(os.environ['GITHUB_REPOSITORY'])
          
          def get_file_hash(filepath, line_num):
              return hashlib.md5(f"{filepath}:{line_num}".encode()).hexdigest()[:8]

          def get_domain_tag(filepath):
              """
              Extracts 'Gameplay' from 'TurnrootFramework/Gameplay/Combat/Script.cs'
              Returns None if the path doesn't match the expected structure.
              """
              parts = Path(filepath).parts
              try:
                  # Look for the index of TurnrootFramework and take the next folder
                  idx = parts.index('TurnrootFramework')
                  if len(parts) > idx + 1:
                      return parts[idx + 1].lower()
              except (ValueError, IndexError):
                  pass
              return None

          def extract_todos(ref='HEAD'):
              todos = {}
              try:
                  result = subprocess.run(
                      ['git', 'ls-tree', '-r', '--name-only', ref],
                      capture_output=True, text=True, check=True
                  )
                  files = [f for f in result.stdout.split('\n') if f.endswith('.cs')]
              except:
                  files = [str(p) for p in Path('.').rglob('*.cs')]
              
              for filepath in files:
                  try:
                      result = subprocess.run(
                          ['git', 'show', f'{ref}:{filepath}'],
                          capture_output=True, text=True, check=False
                      )
                      if result.returncode != 0: continue
                      
                      lines = result.stdout.split('\n')
                      for line_num, line in enumerate(lines, 1):
                          match = re.search(r'//\s*TODO:?\s*(.+)', line, re.IGNORECASE)
                          if match:
                              todo_text = match.group(1).strip()
                              file_hash = get_file_hash(filepath, line_num)
                              
                              todos[file_hash] = {
                                  'file': filepath,
                                  'line': line_num,
                                  'text': todo_text,
                                  'hash': file_hash,
                                  'domain': get_domain_tag(filepath)
                              }
                  except Exception as e:
                      print(f"Error processing {filepath}: {e}")
              return todos

          def get_existing_todo_issues():
              issues = {}
              for issue in repo.get_issues(state='open', labels=['todo', 'automated']):
                  match = re.search(r'\[([a-f0-9]{8})\]', issue.title)
                  if match:
                      issues[match.group(1)] = issue
              return issues

          def sync_existing_issue_labels(existing_issues):
              """Scan open issues and add missing domain tags based on their body content"""
              print("Checking existing issues for missing domain tags...")
              for issue in existing_issues.values():
                  # Find the file path mentioned in the issue body
                  path_match = re.search(r'\*\*File:\*\* `(.+?)`', issue.body)
                  if path_match:
                      filepath = path_match.group(1)
                      domain = get_domain_tag(filepath)
                      if domain:
                          current_labels = [l.name for l in issue.get_labels()]
                          if domain not in current_labels:
                              print(f"Adding missing tag '{domain}' to issue #{issue.number}")
                              issue.add_to_labels(domain)

          def create_issue(todo):
              title = f"TODO [{todo['hash']}]: {todo['text'][:60]}"
              body = f"**TODO found in code:**\n\n**File:** `{todo['file']}`\n**Line:** {todo['line']}\n**Description:** {todo['text']}\n\n---\n*Hash: `{todo['hash']}`*"
              
              labels = ['todo', 'automated']
              if todo['domain']:
                  labels.append(todo['domain'])
              
              issue = repo.create_issue(title=title, body=body, labels=labels)
              print(f"Created issue #{issue.number} with labels {labels}")
              return issue

          # --- Main Logic ---
          current_todos = extract_todos('HEAD')
          existing_issues = get_existing_todo_issues()
          
          # 1. Update existing issues with missing tags
          sync_existing_issue_labels(existing_issues)

          # 2. Close removed TODOs (if PR)
          event_name = os.environ.get('EVENT_NAME')
          if event_name == 'pull_request':
              base_ref = os.environ.get('BASE_REF')
              if base_ref:
                  base_todos = extract_todos(base_ref)
                  removed_hashes = set(base_todos.keys()) - set(current_todos.keys())
                  for h in removed_hashes:
                      if h in existing_issues:
                          # (Close logic remains same as your original)
                          existing_issues[h].edit(state='closed')

          # 3. Create new TODOs
          new_todos = [t for h, t in current_todos.items() if h not in existing_issues]
          for todo in new_todos[:10]:
              create_issue(todo)
          EOF
