name: Tag Version on PR Merge

on:
  pull_request:
    types:
      - closed
    branches:
      - main

jobs:
  tag-version:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read version from package.json
        id: version
        run: |
          VERSION=$(grep '"version"' Assets/TurnrootFramework/package.json | sed 's/.*"version": "\([^"]*\)".*/\1/')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Tagging version: $VERSION"

      - name: Create and push tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Parse the version from package.json and find the next available tag
          BASE="${{ steps.version.outputs.version }}"
          MAJOR=$(echo "$BASE" | cut -d. -f1)
          MINOR=$(echo "$BASE" | cut -d. -f2)
          PATCH=$(echo "$BASE" | cut -d. -f3)

          # Increment patch until we find a tag that doesn't exist yet
          while git ls-remote --tags origin | grep -q "refs/tags/${MAJOR}.${MINOR}.${PATCH}$"; do
            PATCH=$((PATCH + 1))
          done

          FINAL_TAG="${MAJOR}.${MINOR}.${PATCH}"
          echo "Final tag: $FINAL_TAG"
          git tag "$FINAL_TAG"
          git push origin "$FINAL_TAG"
