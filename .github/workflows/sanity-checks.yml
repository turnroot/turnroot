name: Validate C# Struct Serialization & Namespaces

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'Assets/TurnrootFramework/**/*.cs'
  pull_request:
    branches:
      - main
      - master
    paths:
      - 'Assets/TurnrootFramework/**/*.cs'
  workflow_dispatch:

jobs:
  validate-structs:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Validate public structs and namespaces
        run: |
          python - <<'EOF'
          import re
          import sys
          from pathlib import Path

          SCAN_ROOT = Path('Assets/TurnrootFramework')

          failures = []   # namespace violations  → fail the job
          warnings = []   # serializable violations → warn only
          allowed_warnings = 9

          # Matches a public struct declaration (covers partial structs too).
          # Does NOT match private/internal/protected structs.
          PUBLIC_STRUCT_RE = re.compile(
              r'^\s*(?:(?:readonly|partial|unsafe)\s+)*public\s+(?:(?:readonly|partial|unsafe)\s+)*struct\s+\w+',
              re.MULTILINE
          )

          # [Serializable] with no namespace qualifier (needs `using System;`)
          ATTR_BARE_RE = re.compile(r'^\s*\[Serializable\]', re.MULTILINE)
          # [System.Serializable] — always valid, no using needed
          ATTR_FULL_RE = re.compile(r'^\s*\[System\.Serializable\]', re.MULTILINE)
          # `using System;` (covers `using System ;` etc.)
          USING_SYSTEM_RE = re.compile(r'^\s*using\s+System\s*;', re.MULTILINE)
          # Any namespace declaration
          NAMESPACE_RE = re.compile(r'^\s*namespace\s+\S+', re.MULTILINE)

          # ---------------------------------------------------------------
          # Helpers
          # ---------------------------------------------------------------

          def strip_comments_and_strings(source: str) -> str:
              """
              Remove line comments, block comments, and string literals so we
              don't false-positive on commented-out or string-embedded patterns.
              """
              # Block comments
              source = re.sub(r'/\*.*?\*/', '', source, flags=re.DOTALL)
              # Line comments
              source = re.sub(r'//[^\n]*', '', source)
              # Verbatim strings (@"...")
              source = re.sub(r'@"[^"]*"', '""', source)
              # Regular strings (naive, good enough for struct attribute scanning)
              source = re.sub(r'"(?:[^"\\]|\\.)*"', '""', source)
              return source

          def has_public_struct(clean: str) -> bool:
              return bool(PUBLIC_STRUCT_RE.search(clean))

          def has_namespace(clean: str) -> bool:
              return bool(NAMESPACE_RE.search(clean))

          def has_valid_serializable(clean: str) -> bool:
              """
              Returns True when every public struct in the file is covered by a
              valid [Serializable] attribute.  We accept:
                - [System.Serializable]        (always valid)
                - [Serializable] + using System;
              """
              if ATTR_FULL_RE.search(clean):
                  return True
              if ATTR_BARE_RE.search(clean) and USING_SYSTEM_RE.search(clean):
                  return True
              return False

          def gha_error(filepath, message):
              """Emit a GitHub Actions error annotation."""
              print(f"::error file={filepath}::{message}")

          def gha_warning(filepath, message):
              """Emit a GitHub Actions warning annotation."""
              print(f"::warning file={filepath}::{message}")

          # ---------------------------------------------------------------
          # Scan
          # ---------------------------------------------------------------

          files_checked = 0

          for cs_file in sorted(SCAN_ROOT.rglob('*.cs')):
              # Skip generated / Unity-internal paths
              if any(part in cs_file.parts for part in ('bin', 'obj', '.git', 'Samples', 'samples')):
                  continue

              try:
                  raw = cs_file.read_text(encoding='utf-8')
              except Exception as exc:
                  print(f"WARNING: Could not read {cs_file}: {exc}")
                  continue

              clean = strip_comments_and_strings(raw)
              files_checked += 1

              # 1. Namespace check — FAILURE
              if not has_namespace(clean):
                  msg = "Missing namespace declaration"
                  gha_error(cs_file, msg)
                  failures.append(f"  ✗ {cs_file}: {msg}")

              # 2. Serializable check — WARNING only
              if has_public_struct(clean) and not has_valid_serializable(clean):
                  msg = ("Public struct found but no valid [Serializable] attribute. "
                         "Add [System.Serializable] directly, or [Serializable] with `using System;`")
                  gha_warning(cs_file, msg)
                  warnings.append(f"  ⚠ {cs_file}: {msg}")

              if len(warnings) > allowed_warnings:
                warnings.append("More structs than the known ones have failed. Add [System.Serializable] or update allowed_warnings")

          # ---------------------------------------------------------------
          # Report
          # ---------------------------------------------------------------

          print(f"\nScanned {files_checked} .cs file(s) under {SCAN_ROOT}")

          if warnings:
              print(f"\nWarnings ({len(warnings)}) — will not fail the build:")
              print('\n'.join(warnings))

          if failures:
              print(f"\nFailed ({len(failures)}) — namespace violations must be fixed:")
              print('\n'.join(failures))
              sys.exit(1)
          else:
              print("\nNamespace check PASSED.")
              if not warnings:
                  print("Serializable check PASSED.")

          EOF
